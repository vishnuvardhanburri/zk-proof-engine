name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm --output-format json --output-file sbom.json

      - name: Archive artifacts
        run: |
          tar -czf zk-proof-engine-release.tar.gz packages sbom.json
      
      - name: Generate SLSA Build Provenance
        id: attest
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            zk-proof-engine-release.tar.gz
            sbom.json

      - name: Export provenance for Scorecard
        run: cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Sign artifacts
        run: |
          cosign sign-blob --yes zk-proof-engine-release.tar.gz > release.sig
          cosign sign-blob --yes sbom.json > sbom.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            zk-proof-engine-release.tar.gz
            sbom.json
            release.sig
            sbom.sig
            provenance.intoto.jsonl
          generate_release_notes: true
