name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review (vulnerability & license guard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review
        uses: actions/dependency-review-action@3b1591399b83e067facf6323d6a99268f707f185 # v4
        with:
          fail-on-severity: high
