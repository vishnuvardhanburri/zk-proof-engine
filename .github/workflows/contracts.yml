name: Smart Contracts CI

on:
  push:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  pull_request:
    paths: ['contracts/**', '.github/workflows/contracts.yml']

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test, Fuzz, Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Unit + integration tests
        run: forge test --match-path "test/*.t.sol"

      - name: Property fuzz tests
        run: forge test --match-path "test/fuzz/*.t.sol" -vv

      - name: Invariant tests
        run: forge test --match-path "test/invariants/*.t.sol" -vv

      - name: Gas snapshot gate
        run: forge snapshot --check

      - name: Forge fmt check
        run: forge fmt --check

  static-analysis:
    name: Slither + Gas report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodule: recursive

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable

      - name: Build
        run: forge build

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install slither & solc-select
        run: |
          pip install slither-analyzer solc-select
          solc-select install 0.8.27
          solc-select use 0.8.27
          echo "$HOME/.solc-select" >> "$GITHUB_PATH"

      - name: Slither (scoped to our contracts, triaged exclusions)
        run: |
          slither . \
            --filter-paths "VerifierPoseidonPreimage|VerifierMerkleInclusion|openzeppelin|forge-std" \
            --exclude naming-conventions,unindexed-event,assembly,deprecated-standalone,low-level-calls,boolean-equal,missing-inheritance,arbitrary-send-eth,timestamp \
            --fail-low

      - name: Gas report artifact
        run: forge test --match-path "test/*.t.sol" --gas-report > gas-report.txt || true
        continue-on-error: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gas-report
          path: contracts/gas-report.txt